<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A - Control Room (control tower concept)</title>
<link rel="stylesheet" href="base.css">
<style>
/* A, Control Room: the network is the screen. Every truck moves on its lane in real time; disruptions pulse
   where they happen; the queue on the right is ranked by money at risk. Pick an incident and the map
   flies to it, lights the trucks it touches and dims the rest. */
:root{--bg:#06080c;--panel:#0b0f15;--panel2:#0f141c;--line:#1a222d;--line2:#252f3c;--ink:#e8edf2;--mut:#8593a5;--dim:#56616f;
  --ok:#35d0c0;--watch:#ffb547;--risk:#ff5a4e;--sel:#ffffff;
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--disp:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --fig:Bahnschrift,"DIN Alternate","Segoe UI",sans-serif;--mono:"Cascadia Mono",Consolas,monospace;--top:56px;--feed:38px}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--ui)}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.cr{display:grid;grid-template-rows:var(--top) 1fr var(--feed);height:calc(100dvh - var(--bar))}
/* top line */
.top{display:flex;align-items:center;gap:22px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(#0a0e14,#080b10)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 210deg,var(--ok),#5ea0ff,var(--ok));box-shadow:0 0 18px -4px var(--ok)}
.brand b{font:600 15px/1 var(--disp);letter-spacing:.01em}
.brand span{color:var(--mut);font-size:12px}
.clock{font:500 13px/1 var(--mono);color:var(--mut);padding:5px 9px;border:1px solid var(--line2);border-radius:6px}
.clock::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:1px;box-shadow:0 0 8px var(--ok);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.kpis{display:flex;gap:26px;margin-left:6px}
.kpi b{display:block;font:600 19px/1 var(--fig);font-stretch:90%;letter-spacing:.01em}
.kpi span{display:block;font-size:11px;color:var(--mut);margin-top:3px;letter-spacing:.02em}
.kpi.risk b{color:var(--risk)}
.right{margin-left:auto;display:flex;align-items:center;gap:14px}
.roles{display:flex;border:1px solid var(--line2);border-radius:8px;padding:2px}
.roles button{font-size:12px;padding:5px 10px;border-radius:6px;color:var(--mut);white-space:nowrap}
.roles button[aria-pressed=true]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.chaos{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);white-space:nowrap}
.chaos i{width:30px;height:17px;border-radius:9px;background:var(--line2);position:relative;transition:background .3s}
.chaos i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#cfd6de;transition:transform .3s var(--ease)}
.chaos[aria-pressed=true]{color:var(--risk)}
.chaos[aria-pressed=true] i{background:var(--risk)}
.chaos[aria-pressed=true] i::after{transform:translateX(13px)}
/* map */
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
.map{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 40% 45%,#0b1119 0%,#06080c 70%)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
#world{transition:transform 1.1s var(--ease);transform-origin:0 0}
.grat{stroke:#111823;stroke-width:1}
.lane{fill:none;stroke:#1d2735;stroke-width:1;transition:stroke .4s,opacity .4s}
.lane.hot{stroke:color-mix(in srgb,var(--risk) 70%,transparent);stroke-width:1.4}
.lane.warm{stroke:color-mix(in srgb,var(--watch) 55%,transparent)}
.dim .lane:not(.hot),.dim .truck:not(.hot),.dim .city:not(.hot){opacity:.18}
.city{fill:#3b4757}
.city.hot{fill:#dfe6ee}
.cityl{fill:var(--mut);font:11px var(--ui);paint-order:stroke;stroke:#06080c;stroke-width:3px;opacity:0;transition:opacity .4s}
.dim .cityl.hot,.show-labels .cityl{opacity:1}
.dc circle{fill:#06080c;stroke:#dfe6ee;stroke-width:1.5}
.dc .core{fill:#dfe6ee;stroke:none}
.dc text{fill:var(--ink);font:600 12px var(--disp);paint-order:stroke;stroke:#06080c;stroke-width:4px;letter-spacing:.02em}
.truck{transition:opacity .4s}
.truck[data-s="on time"]{fill:var(--ok)}
.truck[data-s=watch]{fill:var(--watch)}
.truck[data-s="at risk"]{fill:var(--risk)}
.truck.stale{fill:none;stroke:var(--watch);stroke-width:1}
.ring{fill:none;stroke:var(--risk);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:pulse 2.6s var(--ease) infinite}
.ring.b{animation-delay:1.3s}
.ring.watch{stroke:var(--watch)}
.zone{fill:color-mix(in srgb,var(--risk) 9%,transparent);stroke:color-mix(in srgb,var(--risk) 45%,transparent);stroke-dasharray:3 4}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.cap{position:absolute;left:18px;top:16px;max-width:460px;pointer-events:none}
.cap small{display:block;font:600 11px var(--mono);letter-spacing:.08em;color:var(--risk);text-transform:uppercase}
.cap b{display:block;font:600 22px/1.15 var(--disp);margin-top:6px;text-shadow:0 2px 12px #000}
.cap span{display:block;color:var(--mut);margin-top:6px;font-size:13px}
.legend{position:absolute;left:18px;bottom:14px;display:flex;gap:16px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
/* rail */
.rail{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.rh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.rh b{font:600 13px var(--disp);letter-spacing:.02em}
.rh span{font-size:12px;color:var(--mut)}
.q{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:#253041 transparent}
.card{display:block;width:100%;padding:14px 16px;border-bottom:1px solid var(--line);position:relative;transition:background .2s}
.card:hover{background:var(--panel2)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--line2))}
.card[aria-expanded=true]{background:var(--panel2)}
.card .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .ex{font:600 24px/1 var(--fig);font-stretch:88%}
.card .ex.zero{color:var(--mut)}
.card .kind{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--mut))}
.card .t{font-weight:600;margin-top:6px;line-height:1.3}
.card .m{font-size:12px;color:var(--mut);margin-top:4px}
.det{padding:4px 16px 18px;border-bottom:1px solid var(--line);background:var(--panel2);animation:open .35s var(--ease)}
@keyframes open{from{opacity:0;transform:translateY(-4px)}}
.det p{color:#c4cdd8;font-size:13px}
.det h4{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.steps{display:grid;gap:6px;font-size:12.5px;color:#c4cdd8}
.steps div{display:flex;gap:8px}
.steps div::before{content:"";flex:none;width:14px;height:14px;margin-top:2px;border-radius:50%;border:1px solid var(--ok);background:radial-gradient(circle,var(--ok) 0 3px,transparent 3.5px)}
.trace{font:11px var(--mono);color:var(--dim);margin-top:8px}
.clause{border-left:2px solid var(--watch);padding:6px 10px;font-size:12.5px;color:#d6dde6;background:#141a23}
.clause b{font:600 11px var(--mono);color:var(--watch);margin-right:6px}
.pb{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pb b{font-size:13px}
.pb span{font-size:12px;color:var(--mut);grid-column:1}
.pb button{grid-row:1/3;grid-column:2;font:600 12px var(--ui);padding:7px 12px;border-radius:7px;border:1px solid var(--line2);white-space:nowrap}
.pb button.need{border-color:var(--watch);color:var(--watch)}
.pb button:hover{background:#fff;color:#000;border-color:#fff}
.pb button.done{border-color:var(--ok);color:var(--ok);pointer-events:none}
.pb .audit{grid-column:1/-1;font:11px var(--mono);color:var(--ok)}
.ships{display:grid;gap:5px;font-size:12px}
.ships div{display:grid;grid-template-columns:70px 1fr auto;gap:8px;color:#c4cdd8}
.ships i{font-style:normal;color:var(--mut);font-family:var(--mono);font-size:11px}
.ships em{font-style:normal;font-family:var(--fig)}
.hidden-note{font-size:12px;color:var(--watch);margin-top:6px}
/* feed */
.feed{display:flex;align-items:center;gap:18px;padding:0 18px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);overflow:hidden;white-space:nowrap;background:#080b10}
.feed b{color:var(--ink);font-weight:600}
.feed .f{display:flex;align-items:center;gap:7px}
.feed .f i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.feed .f.warn i{background:var(--watch)}
.feed .f.bad i{background:var(--risk);animation:blink 1s infinite}
.feed .sp{margin-left:auto}
@media(max-width:1279px){
  .brand span,.clock{display:none}
  .kpis{gap:16px}
  .kpi:nth-child(3){display:none}
  main{grid-template-columns:minmax(0,1fr) 370px}
}
@media(max-width:999px){
  .right{flex-wrap:wrap;gap:10px}
  .roles button{padding:5px 8px;font-size:11.5px}
  .cr{height:auto;display:block}
  .top{flex-wrap:wrap;height:auto;padding:12px 14px;gap:12px 18px}
  .kpis{width:100%;margin:0;justify-content:space-between;gap:10px}
  .right{margin:0;width:100%;justify-content:space-between}
  main{display:block}
  .map{height:58vh;min-height:360px}
  .cap{left:12px;right:12px;top:12px}
  .cap b{font-size:18px}
  .rail{border-left:0;border-top:1px solid var(--line)}
  .q{overflow:visible}
  .feed{flex-wrap:wrap;white-space:normal;padding:10px 14px;gap:8px 14px;height:auto}
  .feed .sp{margin:0}
}
</style>
</head>
<body>
<div class="cr" id="cr">
  <header class="top">
    <div class="brand"><i></i><div><b>Tarangini Control Tower</b><br><span>FMCG distribution · 4 DCs · 36 cities</span></div></div>
    <span class="clock num" id="clock"></span>
    <div class="kpis" id="kpis"></div>
    <div class="right">
      <div class="roles" role="group" aria-label="View as" id="roles"></div>
      <button class="chaos" id="chaos" aria-pressed="false"><i></i>Simulate outage</button>
    </div>
  </header>
  <main>
    <section class="map" id="mapwrap" aria-label="Network map">
      <svg id="map" role="img" aria-label="Warehouses, lanes and trucks in transit"><g id="world"></g></svg>
      <div class="cap" id="cap"></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>On time</span><span><i style="background:var(--watch)"></i>Watch</span><span><i style="background:var(--risk)"></i>At risk</span></div>
    </section>
    <aside class="rail">
      <div class="rh"><b>Triage queue</b><span>ranked by money at risk</span></div>
      <div class="q" id="q"></div>
    </aside>
  </main>
  <footer class="feed" id="feed"></footer>
</div>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
conceptbar("A", "Control Room", "Map-first, dark. Trucks move live; pick an incident and the map flies to it. Simulated data on the real network.");
clock(document.getElementById("clock"));
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map"), world = document.getElementById("world"), wrap = document.getElementById("mapwrap");
let role = "vp", sel = null, chaos = false;
const KC = { Weather: "var(--watch)", Facility: "var(--risk)", Carrier: "var(--risk)", Supplier: "#8ab4ff" };
const approved = new Set();

// ---- map ----
// The camera re-projects every point (no CSS scaling), so dots, strokes and labels keep their size when it flies.
let P0, cam = { s: 1, tx: 0, ty: 0 }, lanes = {}, trucks = [], items = [];
const P = (lat, lon) => { const [x, y] = P0(lat, lon); return [x * cam.s + cam.tx, y * cam.s + cam.ty]; };
function el(tag, attrs, parent = world) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
const DC_CITY = new Set(C.dcs.map((d) => d.city.split(" (")[0]));
function drawMap() {
  world.innerHTML = ""; items = []; lanes = {};
  const r = wrap.getBoundingClientRect();
  P0 = projector(r.width, r.height, 48);
  const grat = el("g", {});
  for (let lat = 8; lat <= 32; lat += 4) items.push({ n: el("line", { class: "grat" }, grat), u: (n) => { const [x1, y] = P(lat, BOUNDS.lon0 - 20), [x2] = P(lat, BOUNDS.lon1 + 20); n.setAttribute("x1", x1); n.setAttribute("x2", x2); n.setAttribute("y1", y); n.setAttribute("y2", y); } });
  for (let lon = 66; lon <= 98; lon += 4) items.push({ n: el("line", { class: "grat" }, grat), u: (n) => { const [x, y1] = P(BOUNDS.lat1 + 20, lon), [, y2] = P(BOUNDS.lat0 - 20, lon); n.setAttribute("x1", x); n.setAttribute("x2", x); n.setAttribute("y1", y1); n.setAttribute("y2", y2); } });
  for (const z of C.zones) {
    const node = el("path", { class: "lane", "data-z": z.id });
    items.push({ n: node, u: (n) => { const L = lanePath(P, dcOf(z.dc), z); lanes[z.id] = L; n.setAttribute("d", L.d); } });
  }
  for (const d of C.disruptions) if (d.lat) items.push({ n: el("circle", { class: "zone", "data-d": d.id }), u: (n) => { const [x, y] = P(d.lat, d.lon), [x2] = P(d.lat, d.lon + d.r / 105); n.setAttribute("cx", x); n.setAttribute("cy", y); n.setAttribute("r", Math.max(10, x2 - x)); } });
  trucks = C.shipments.map((s) => ({ s, node: el("circle", { r: 2.6, class: "truck", "data-s": s.status, "data-id": s.id }) }));
  for (const z of C.zones) {
    items.push({ n: el("circle", { r: 2.4, class: "city", "data-z": z.id }), u: (n) => { const [x, y] = P(z.lat, z.lon); n.setAttribute("cx", x); n.setAttribute("cy", y); } });
    if (DC_CITY.has(z.city)) continue; // the warehouse label already names it
    const t = el("text", { class: "cityl", "data-z": z.id }); t.textContent = z.city;
    items.push({ n: t, u: (n) => { const [x, y] = P(z.lat, z.lon); n.setAttribute("x", x + 6); n.setAttribute("y", y + 4); } });
  }
  for (const d of C.disruptions) {
    const at = d.lat ? [d.lat, d.lon] : d.dc ? [dcOf(d.dc).lat, dcOf(d.dc).lon] : null;
    if (!at) continue;
    for (const b of ["", "b"]) items.push({ n: el("circle", { r: 16, class: `ring ${b} ${d.exposure ? "" : "watch"}` }), u: (n) => { const [x, y] = P(...at); n.setAttribute("cx", x); n.setAttribute("cy", y); } });
  }
  for (const d of C.dcs) {
    const g = el("g", { class: "dc" });
    const a = el("circle", { r: 9 }, g), b = el("circle", { r: 3.5, class: "core" }, g), t = el("text", {}, g);
    t.textContent = d.city.split(" (")[0].toUpperCase();
    items.push({ n: g, u: () => { const [x, y] = P(d.lat, d.lon); a.setAttribute("cx", x); a.setAttribute("cy", y); b.setAttribute("cx", x); b.setAttribute("cy", y); t.setAttribute("x", x + 14); t.setAttribute("y", y + 4); } });
  }
  update();
  applySel(false);
}
function update() { for (const it of items) it.u(it.n); }
let flight = null;
function flyTo(target) {
  const from = { ...cam }, t0 = performance.now();
  flight = (now) => {
    const k = Math.min(1, (now - t0) / 1000), e = 1 - Math.pow(1 - k, 4);
    cam = { s: from.s + (target.s - from.s) * e, tx: from.tx + (target.tx - from.tx) * e, ty: from.ty + (target.ty - from.ty) * e };
    update();
    if (k >= 1) flight = null;
  };
}
const t0 = performance.now();
function frame(now) {
  if (flight) flight(now);
  const dt = (now - t0) / 1000;
  for (const T of trucks) {
    const L = lanes[T.s.zone];
    if (!L) continue;
    const stuck = T.s.status === "at risk" || (chaos && T.s.carrier === "C2");
    const p = Math.min(0.985, T.s.progress + (stuck ? 0 : dt * 0.0035));
    const [x, y] = L.at(p);
    T.node.setAttribute("cx", x.toFixed(1)); T.node.setAttribute("cy", y.toFixed(1));
  }
  requestAnimationFrame(frame);
}

// ---- state views ----
const visible = () => C.disruptions.filter((d) => role !== "south" || d.shipments.some((id) => shipOf(id).dc === "DC-HYD"));
function kpis() {
  const ships = C.shipments.filter(ROLE_SCOPE[role]);
  const ds = visible();
  const exp = ds.reduce((a, d) => a + (role === "south" ? d.shipments.map(shipOf).filter((s) => s.dc === "DC-HYD").reduce((x, s) => x + s.value, 0) * (d.exposure / Math.max(1, d.value)) : d.exposure), 0);
  document.getElementById("kpis").innerHTML = [
    [inr(ships.reduce((a, s) => a + s.value, 0)), `moving · ${ships.length} trucks`],
    [ships.filter((s) => s.status === "at risk").length, "trucks at risk", "risk"],
    [ds.length, "open incidents"],
    [inr(exp), "exposure today", "risk"],
  ].map(([v, l, c]) => `<div class="kpi ${c ?? ""}"><b class="num">${v}</b><span>${l}</span></div>`).join("");
}
function queue() {
  const ds = visible();
  document.getElementById("q").innerHTML = ds.map((d) => {
    const open = d.id === sel;
    const ships = d.shipments.map(shipOf).filter(ROLE_SCOPE[role]);
    const hidden = d.shipments.length - ships.length;
    return `<button class="card" data-d="${d.id}" aria-expanded="${open}" style="--c:${KC[d.kind]}">
      <div class="row1"><span class="kind">${d.kind} · ${d.started}</span><span class="ex num ${d.exposure ? "" : "zero"}">${d.exposure ? inr(d.exposure) : "₹0"}</span></div>
      <div class="t">${esc(d.title)}</div>
      <div class="m">${d.shipments.length} shipments · ${inr(d.value)} moving · ${esc(d.clause.id)}</div></button>` + (open ? `<div class="det">
      <p>${esc(d.detail)}</p>
      <h4>What the agent did · ${(d.agent.ms / 1000).toFixed(1)} s</h4>
      <div class="steps">${d.agent.steps.map((s) => `<div>${esc(s)}</div>`).join("")}</div>
      <div class="trace">trace ${d.id.toLowerCase()} · ${d.agent.tokens.toLocaleString("en-IN")} tokens · local model · ₹0</div>
      <h4>Contract</h4><div class="clause"><b>${d.clause.id}</b>${esc(d.clause.text)}</div>
      <h4>Playbooks</h4>${d.playbooks.map((p) => {
        const k = d.id + p.id, done = approved.has(k);
        return `<div class="pb"><b>${esc(p.title)}</b><span>${esc(p.impact)}${p.cost ? ` · costs ${inr(p.cost)}` : ""}${p.saves ? ` · saves ${inr(p.saves)}` : ""}</span>
          <button class="${done ? "done" : p.needsApproval ? "need" : ""}" data-pb="${k}">${done ? "Done" : p.needsApproval ? "Approve" : "Run"}</button>
          ${done ? `<span class="audit">${p.needsApproval ? "approved" : "run"} by ${C.roles.find((r) => r.id === role).name} · ${hhmm(new Date().toISOString())} · audit A-${2200 + approved.size}</span>` : ""}</div>`;
      }).join("")}
      <h4>Shipments · ${ships.length} you can see</h4>
      <div class="ships">${ships.slice(0, 6).map((s) => `<div><i>${s.id}</i><span>${esc(s.customer)} · ${esc(carrierOf(s.carrier).name.split(" ")[0])} ${esc(mask(carrierOf(s.carrier).contact, role, "phone"))}</span><em class="num">${inr(s.value)}</em></div>`).join("")}</div>
      ${hidden ? `<div class="hidden-note">${hidden} shipments outside your zone are hidden</div>` : ""}</div>` : "");
  }).join("");
}
function applySel(fly = true) {
  const d = C.disruptions.find((x) => x.id === sel);
  const hot = new Set(d ? d.shipments.filter((id) => ROLE_SCOPE[role](shipOf(id))) : []);
  const hz = new Set([...hot].map((id) => shipOf(id).zone));
  world.classList.toggle("dim", !!d || role === "south");
  if (!d && role === "south") C.shipments.filter(ROLE_SCOPE.south).forEach((s) => { hot.add(s.id); hz.add(s.zone); });
  world.querySelectorAll(".lane").forEach((n) => { n.classList.toggle("hot", hz.has(n.dataset.z) && !!d); n.classList.toggle("warm", hz.has(n.dataset.z) && !d); if (!d && role === "south") n.classList.toggle("hot", hz.has(n.dataset.z)); });
  world.querySelectorAll(".city,.cityl").forEach((n) => n.classList.toggle("hot", hz.has(n.dataset.z)));
  trucks.forEach((T) => T.node.classList.toggle("hot", hot.has(T.s.id)));
  // fly to the incident
  const r = wrap.getBoundingClientRect();
  if (d && fly && r.width > 0) {
    // frame the incident: its affected cities, their warehouses and the event itself, in base coordinates
    const ll = [...hz].flatMap((z) => [zoneOf(z), dcOf(zoneOf(z).dc)]).concat(d.lat ? [{ lat: d.lat, lon: d.lon }] : d.dc ? [dcOf(d.dc)] : []);
    const pts = ll.map((p) => P0(p.lat, p.lon));
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const bw = Math.max(120, Math.max(...xs) - Math.min(...xs)), bh = Math.max(120, Math.max(...ys) - Math.min(...ys));
    const s = Math.min(2.4, Math.max(1, Math.min((r.width - 200) / bw, (r.height - 220) / bh)));
    const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
    flyTo({ s, tx: r.width / 2 - cx * s, ty: r.height / 2 + 30 - cy * s });
  } else if (!d) flyTo({ s: 1, tx: 0, ty: 0 });
  document.getElementById("cap").innerHTML = d ? `<small>${d.id} · ${d.kind} · since ${d.started}</small><b>${esc(d.title)}</b><span>${hot.size} trucks lit · ${inr(d.exposure)} at risk · click the incident again to zoom out</span>`
    : role === "south" ? `<small>Viewing as Dispatcher, South</small><b>Hyderabad DC lanes only</b><span>Other zones are hidden by your role.</span>` : "";
}
function feed() {
  const fs = C.health.feeds.map((f) => {
    const ok = chaos && /Carrier|ERP/.test(f.name) ? 0.7 : f.ok;
    return `<span class="f ${ok < 0.8 ? "bad" : ok < 0.97 ? "warn" : ""}"><i></i>${esc(f.name.split(" (")[0])} <b class="num">${(ok * 100).toFixed(1)}%</b></span>`;
  }).join("");
  document.getElementById("feed").innerHTML = fs + `<span class="sp">dead letters <b class="num">${C.health.dlq + (chaos ? 41 : 0)}</b> · p95 <b class="num">${chaos ? 2310 : C.health.p95} ms</b>${chaos ? ` · <b style="color:var(--risk)">carrier API circuit open, serving cached ETAs</b>` : ""}</span>`;
  trucks.forEach((T) => T.node.classList.toggle("stale", chaos && T.s.carrier === "C2"));
}
function render() { kpis(); queue(); applySel(); feed(); }

document.getElementById("roles").innerHTML = C.roles.map((r) => `<button data-role="${r.id}" aria-pressed="${r.id === role}" title="${esc(r.name)}: ${esc(r.sees)}">${esc(r.title)}</button>`).join("");
document.addEventListener("click", (e) => {
  const c = e.target.closest(".card"), rb = e.target.closest("[data-role]"), pb = e.target.closest("[data-pb]");
  if (pb) { approved.add(pb.dataset.pb); queue(); return; }
  if (c) { sel = sel === c.dataset.d ? null : c.dataset.d; queue(); applySel(); return; }
  if (rb) { role = rb.dataset.role; document.querySelectorAll("[data-role]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.role === role)); sel = null; render(); return; }
  if (e.target.closest("#chaos")) { chaos = !chaos; document.getElementById("chaos").setAttribute("aria-pressed", chaos); feed(); }
});
addEventListener("resize", () => { cam = { s: 1, tx: 0, ty: 0 }; drawMap(); applySel(); });
drawMap(); render(); requestAnimationFrame(frame);
sel = C.disruptions[0].id; queue(); setTimeout(() => applySel(), 700);
</script>
</body>
