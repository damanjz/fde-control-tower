<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C - Ripple (control tower concept)</title>
<link rel="stylesheet" href="base.css">
<style>
/* C, Ripple: the ontology is the screen. Suppliers, warehouses, carriers, cities and customers stand as five
   columns joined by the morning's real flows. An incident starts at its source and ripples right, lighting
   every link it reaches and pricing each customer it lands on. The timeline below replays the morning. */
:root{--bg:#0a0a0d;--ink:#f1f1f3;--mut:#8b8b96;--dim:#3a3a44;--line:#1f1f27;--hot:#ff6a3d;--hot2:#ffb38f;--ok:#5ee6b0;
  --cond:Bahnschrift,"DIN Alternate","Arial Narrow",sans-serif;--ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Mono",Consolas,monospace;--top:64px;--tl:132px}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--ui)}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.rp{display:grid;grid-template-rows:var(--top) 1fr var(--tl);height:calc(100dvh - var(--bar));background:radial-gradient(80% 60% at 50% 40%,#13131a 0%,#0a0a0d 70%)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;border-bottom:1px solid var(--line)}
.brand b{font:700 20px/1 var(--cond);font-stretch:80%;letter-spacing:.04em;text-transform:uppercase}
.brand span{display:block;font:11px var(--mono);color:var(--mut);margin-top:4px;letter-spacing:.06em}
.total{text-align:center}
.total b{display:block;font:700 34px/1 var(--cond);font-stretch:78%;color:var(--hot);letter-spacing:.01em;transition:color .3s}
.total span{font:11px var(--mono);color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.ctl{justify-self:end;display:flex;gap:10px;align-items:center}
.ctl select,.ctl button{font:600 12px var(--ui);color:var(--ink);background:#15151b;border:1px solid #2a2a33;border-radius:8px;padding:7px 10px}
.ctl button[aria-pressed=true]{background:var(--hot);border-color:var(--hot);color:#111}
.stage{position:relative;min-height:0}
svg{position:absolute;inset:0;width:100%;height:100%}
.colh{fill:var(--mut);font:600 10.5px var(--mono);letter-spacing:.12em}
.e{fill:none;stroke:#23232c;stroke-linecap:round;transition:stroke .5s,opacity .5s}
.e.lit{stroke:var(--hot);opacity:1;stroke-dasharray:6 900;animation:run 1.4s var(--ease) both}
.e.lit2{stroke:color-mix(in srgb,var(--hot) 55%,transparent)}
@keyframes run{from{stroke-dasharray:0 1200;stroke-dashoffset:0}to{stroke-dasharray:1200 0}}
.n circle{fill:#16161c;stroke:#3a3a46;stroke-width:1;transition:fill .4s,stroke .4s,r .4s}
.n text{fill:#b9b9c4;font:12px var(--ui);transition:fill .4s}
.n .v{fill:var(--hot2);font:600 11px var(--mono);opacity:0;transition:opacity .4s}
.n.lit circle{fill:var(--hot);stroke:var(--hot)}
.n.lit text{fill:#fff}
.n.lit .v{opacity:1}
.n.src circle{fill:#fff;stroke:var(--hot);stroke-width:3}
.n:hover text{fill:#fff}
.n{cursor:pointer}
.big text{font:600 13px var(--ui)}
/* overlays */
.card{position:absolute;left:22px;top:18px;width:300px;padding:16px 18px;background:rgba(18,18,24,.92);border:1px solid #2a2a33;border-radius:14px;backdrop-filter:blur(6px)}
.card small{font:600 10.5px var(--mono);letter-spacing:.1em;color:var(--hot);text-transform:uppercase}
.card h2{font:700 24px/1.05 var(--cond);font-stretch:82%;margin-top:6px;letter-spacing:.005em}
.card p{font-size:12.5px;color:#c9c9d2;margin-top:8px}
.card .row{display:flex;gap:18px;margin-top:12px}
.card .row b{display:block;font:700 22px/1 var(--cond);font-stretch:80%}
.card .row span{font-size:11px;color:var(--mut)}
.card .act{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid #2a2a33}
.card .act span{font-size:12px;color:#c9c9d2}
.card .act button{flex:none;font:700 12px var(--ui);padding:8px 12px;border-radius:8px;background:var(--hot);color:#111}
.card .act button.done{background:none;color:var(--ok);border:1px solid var(--ok)}
.insp{position:absolute;right:22px;top:16px;width:260px;padding:14px 16px;background:rgba(18,18,24,.92);border:1px solid #2a2a33;border-radius:14px;font-size:12.5px;display:none}
.insp.on{display:block}
.insp small{font:600 10px var(--mono);letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.insp b{display:block;font:700 18px var(--cond);font-stretch:85%;margin:4px 0 8px}
.insp div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid #23232c;color:#c9c9d2}
.insp div em{font-style:normal;font-family:var(--mono);color:#fff}
/* timeline */
.tl{border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:0 18px;align-items:center;padding:12px 22px}
.play{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#111;display:grid;place-items:center}
.play svg{position:static;width:16px;height:16px}
.track{position:relative;height:100%}
.track svg{position:absolute;inset:0;width:100%;height:100%}
.axis{fill:var(--mut);font:11px var(--mono)}
.tick{cursor:pointer}
.tick circle{fill:#16161c;stroke:var(--hot);stroke-width:2}
.tick.on circle{fill:var(--hot)}
.tick text{fill:#c9c9d2;font:11.5px var(--ui)}
.curve{fill:none;stroke:var(--hot);stroke-width:2}
.area{fill:url(#g)}
.head{stroke:#fff;stroke-width:1}
.chaosnote{position:absolute;right:22px;bottom:18px;max-width:300px;padding:10px 12px;border-radius:10px;background:#2a1410;border:1px solid var(--hot);font-size:12px;color:#ffd7c9;display:none}
.chaos .chaosnote{display:block}
.chaos .e:not(.lit){stroke-dasharray:2 5;animation:flick 1.2s steps(2) infinite}
@keyframes flick{50%{opacity:.4}}
@media(max-width:999px){
  .rp{height:auto;display:block}
  .top{grid-template-columns:1fr;gap:10px;padding:12px 14px;text-align:left;height:auto}
  .total{text-align:left}.ctl{justify-self:start}
  .stage{display:flex;flex-direction:column}
  .stage svg{position:relative;display:block;height:720px}
  .card{position:relative;left:auto;top:auto;width:auto;margin:12px;order:-1}
  .insp{position:relative;right:auto;top:auto;width:auto;margin:0 12px 12px}
  .tl{height:140px;padding:12px 14px}
}
</style>
</head>
<body>
<div class="rp" id="rp">
  <header class="top">
    <div class="brand"><b>Tarangini · Ripple</b><span>FMCG network · today since 05:00</span></div>
    <div class="total"><b class="num" id="total">₹0</b><span>money at risk so far today</span></div>
    <div class="ctl"><select id="role" aria-label="View as"></select><button id="chaos" aria-pressed="false">Simulate outage</button></div>
  </header>
  <section class="stage" id="stage">
    <svg id="g" aria-label="Network graph"></svg>
    <div class="card" id="card"></div>
    <div class="insp" id="insp"></div>
    <div class="chaosnote">Outage simulation: 30% of carrier API calls failing and a malformed ERP file. The graph keeps its last good state; ETAs are served from cache and failed rows wait in dead letters.</div>
  </section>
  <footer class="tl">
    <button class="play" id="play" aria-label="Replay the morning"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg></button>
    <div class="track"><svg id="tl"></svg></div>
  </footer>
</div>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
conceptbar("C", "Ripple", "Graph-first, cinematic. An incident ripples through the network; press play to replay the morning.");
const NS = "http://www.w3.org/2000/svg", G = document.getElementById("g"), TL = document.getElementById("tl"), stage = document.getElementById("stage");
let role = "vp", sel = null, chaos = false, shown = new Set();
const approved = new Set();
const CAT = { BE: "Beverages", HO: "Home care", PA: "Packaged foods", PE: "Personal care", SN: "Snacks" };
const chainOf = (s) => s.customer.split(" (")[0];
const cats = Object.values(CAT), chains = [...new Set(C.shipments.map(chainOf))].sort();
const cityOrder = [...C.zones].sort((a, b) => a.dc.localeCompare(b.dc) || a.km - b.km);
const evMin = (d) => { const [h, m] = d.started.split(":").map(Number); return h * 60 + m; };

function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
let N = {}, E = [];
function layout() {
  G.innerHTML = ""; N = {}; E = [];
  const r = G.getBoundingClientRect(), W = r.width, H = r.height, narrow = W < 1000;
  // desktop: the incident card owns the left gutter, the graph runs to its right
  const xs = (narrow ? [0.06, 0.27, 0.46, 0.66, 0.94] : [0.3, 0.45, 0.6, 0.77, 0.95]).map((f) => f * W);
  const top = 46, bot = narrow ? 30 : 30, colH = (n) => (H - top - bot) / Math.max(1, n);
  const cols = [
    ["SUPPLIERS", cats.map((c) => ({ id: "cat:" + c, label: c }))],
    ["WAREHOUSES", C.dcs.map((d) => ({ id: d.id, label: d.city.split(" (")[0] }))],
    ["CARRIERS", C.carriers.map((c) => ({ id: c.id, label: c.name }))],
    ["CITIES", cityOrder.map((z) => ({ id: z.id, label: z.city }))],
    ["CUSTOMERS", chains.map((c) => ({ id: "cu:" + c, label: c }))],
  ];
  // phones: the five layers run top to bottom as rows, so nothing has to squeeze sideways
  const ys = [0.08, 0.3, 0.5, 0.72, 0.93].map((f) => f * H);
  cols.forEach(([h, items], ci) => {
    const t = narrow
      ? el("text", { x: 4, y: ys[ci] - 18, class: "colh" }, G)
      : el("text", { x: xs[ci], y: 22, class: "colh", "text-anchor": ci === 4 ? "end" : ci === 0 ? "start" : "middle" }, G);
    t.textContent = h;
    const step = colH(items.length), stepX = (W - 24) / Math.max(1, items.length);
    items.forEach((it, i) => {
      N[it.id] = narrow ? { ...it, col: ci, x: 12 + stepX * (i + 0.5), y: ys[ci], value: 0, exp: 0 } : { ...it, col: ci, x: xs[ci], y: top + step * (i + 0.5), value: 0, exp: 0 };
    });
  });
  // flows of the morning: category -> DC -> carrier -> city -> customer, weighted by goods value
  const add = (a, b, v) => { const k = a + ">" + b; const e = E.find((x) => x.k === k); if (e) e.v += v; else E.push({ k, a, b, v }); };
  for (const s of C.shipments.filter(ROLE_SCOPE[role])) {
    const cat = "cat:" + CAT[s.skus[0].slice(0, 2)];
    add(cat, s.dc, s.value); add(s.dc, s.carrier, s.value); add(s.carrier, s.zone, s.value); add(s.zone, "cu:" + chainOf(s), s.value);
  }
  const eg = el("g", {}, G), ng = el("g", {}, G);
  const vmax = Math.max(...E.map((e) => e.v));
  for (const e of E) {
    const a = N[e.a], b = N[e.b], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const d = narrow ? `M${a.x},${a.y} C${a.x},${my} ${b.x},${my} ${b.x},${b.y}` : `M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`;
    e.node = el("path", { d, class: "e", "stroke-width": (0.6 + 3.2 * Math.sqrt(e.v / vmax)).toFixed(2) }, eg);
  }
  for (const id in N) {
    const n = N[id], big = n.col < 3;
    const g = el("g", { class: `n ${big ? "big" : ""}`, "data-n": id, tabindex: 0 }, ng);
    el("circle", { cx: n.x, cy: n.y, r: big ? 7 : 3.5 }, g);
    const right = n.col === 4 ? false : n.col === 0 ? false : true;
    const t = el("text", { x: n.x + (n.col === 4 ? -10 : n.col === 0 ? -10 : 10), y: n.y + 4, "text-anchor": n.col === 4 || n.col === 0 ? "end" : "start" }, g);
    if (n.col === 0) { t.setAttribute("x", n.x + 12); t.setAttribute("text-anchor", "start"); }
    t.textContent = n.label;
    if (narrow) {
      // only the short rows keep labels on a phone; tap any dot for its details
      t.setAttribute("x", n.x); t.setAttribute("y", n.y + 20); t.setAttribute("text-anchor", "middle");
      if (n.col === 2) t.textContent = n.label.split(" ")[0];
      if (n.col === 0 || n.col >= 3) t.style.display = "none";
    }
    const v = el("text", { x: n.col === 4 ? n.x - 10 : n.x + 12, y: n.y + 17, class: "v", "text-anchor": n.col === 4 ? "end" : "start" }, g);
    if (narrow) { v.setAttribute("x", n.x); v.setAttribute("y", n.y + 33); v.setAttribute("text-anchor", "middle"); if (n.col !== 1 && n.col !== 2) v.style.display = "none"; }
    n.vnode = v; n.g = g;
  }
  paint(false);
}
function affected(d) { return d.shipments.map(shipOf).filter(ROLE_SCOPE[role]); }
function paint(animate = true) {
  E.forEach((e) => e.node.classList.remove("lit", "lit2"));
  Object.values(N).forEach((n) => { n.g.classList.remove("lit", "src"); n.exp = 0; });
  const ds = C.disruptions.filter((d) => shown.has(d.id));
  for (const d of ds) {
    const ships = affected(d), share = d.value ? d.exposure / d.value : 0;
    const focus = d.id === sel;
    for (const s of ships) {
      const cat = "cat:" + CAT[s.skus[0].slice(0, 2)];
      const path = [cat, s.dc, s.carrier, s.zone, "cu:" + chainOf(s)];
      path.forEach((id, i) => { if (N[id]) { N[id].g.classList.add("lit"); N[id].exp += s.value * share; } if (i) { const e = E.find((x) => x.a === path[i - 1] && x.b === id); if (e) { e.node.classList.add(focus ? "lit" : "lit2"); if (focus && animate) e.node.style.animationDelay = `${(i - 1) * 0.35}s`; } } });
    }
    const src = d.kind === "Supplier" ? "cat:Snacks" : d.kind === "Carrier" ? d.carrier : d.dc ? d.dc : null;
    if (src && N[src]) N[src].g.classList.add("src");
  }
  // cities sit too close for a second line; their money shows in the inspector instead
  Object.values(N).forEach((n) => (n.vnode.textContent = n.col !== 3 && n.exp > 500 ? inr(n.exp) : ""));
  const tot = ds.reduce((a, d) => a + affected(d).reduce((x, s) => x + s.value, 0) * (d.value ? d.exposure / d.value : 0), 0);
  countTo(tot);
  card();
}
let shownTot = 0, raf;
function countTo(v) {
  cancelAnimationFrame(raf); const from = shownTot, t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3); shownTot = from + (v - from) * e; document.getElementById("total").textContent = inr(shownTot); if (k < 1) raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
}
function card() {
  const d = C.disruptions.find((x) => x.id === sel);
  const el2 = document.getElementById("card");
  if (!d) { el2.innerHTML = `<small>Today</small><h2>Press play to replay the morning</h2><p>Six incidents arrived between 05:10 and 09:12. Each one ripples from where it started to the customers it reaches. Click a dot on the timeline to see one.</p>`; return; }
  const ships = affected(d), share = d.value ? d.exposure / d.value : 0, exp = ships.reduce((a, s) => a + s.value, 0) * share;
  const p = d.playbooks.find((x) => x.saves) ?? d.playbooks[0], k = d.id + p.id, done = approved.has(k);
  el2.innerHTML = `<small>${d.kind} · ${d.id} · ${d.started}</small><h2>${esc(d.title)}</h2><p>${esc(d.detail)}</p>
    <div class="row"><div><b class="num">${inr(exp)}</b><span>at risk</span></div><div><b class="num">${ships.length}</b><span>shipments</span></div><div><b class="num">${new Set(ships.map(chainOf)).size}</b><span>customers</span></div></div>
    <div class="act"><span>${esc(p.title)}${p.saves ? ` · saves ${inr(p.saves)}` : ""}</span><button class="${done ? "done" : ""}" data-pb="${k}">${done ? "Approved" : p.needsApproval ? "Approve" : "Run"}</button></div>`;
}
function inspect(id) {
  const n = N[id], box = document.getElementById("insp");
  if (!n) { box.classList.remove("on"); return; }
  const ships = C.shipments.filter(ROLE_SCOPE[role]).filter((s) => [s.dc, s.carrier, s.zone, "cu:" + chainOf(s), "cat:" + CAT[s.skus[0].slice(0, 2)]].includes(id));
  const kind = ["Supplier group", "Warehouse", "Carrier", "City", "Customer"][n.col];
  const c = n.col === 2 ? carrierOf(id) : null;
  box.innerHTML = `<small>${kind}</small><b>${esc(n.label)}</b><div><span>Trucks today</span><em>${ships.length}</em></div><div><span>Goods moving</span><em>${inr(ships.reduce((a, s) => a + s.value, 0))}</em></div><div><span>At risk now</span><em>${n.exp > 0 ? inr(n.exp) : "₹0"}</em></div>${c ? `<div><span>Dispatch phone</span><em>${esc(mask(c.contact, role, "phone"))}</em></div><div><span>Bank</span><em>${esc(mask(c.bank, role, "bank"))}</em></div>` : ""}`;
  box.classList.add("on");
}
// ---- timeline ----
const T0 = 5 * 60, T1 = 11 * 60;
function timeline() {
  TL.innerHTML = `<defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff6a3d" stop-opacity=".35"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></linearGradient></defs>`;
  const r = TL.getBoundingClientRect(), W = r.width, H = r.height, x = (m) => 8 + ((m - T0) / (T1 - T0)) * (W - 16), base = H - 22;
  for (let h = 5; h <= 11; h++) { const t = el("text", { x: x(h * 60), y: H - 4, class: "axis", "text-anchor": h === 5 ? "start" : h === 11 ? "end" : "middle" }, TL); t.textContent = String(h).padStart(2, "0") + ":00"; el("line", { x1: x(h * 60), x2: x(h * 60), y1: base, y2: base + 4, stroke: "#3a3a44" }, TL); }
  el("line", { x1: 8, x2: W - 8, y1: base, y2: base, stroke: "#2a2a33" }, TL);
  // cumulative exposure over the morning
  const evs = [...C.disruptions].sort((a, b) => evMin(a) - evMin(b));
  const max = evs.reduce((a, d) => a + d.exposure, 0) || 1;
  let acc = 0, pts = [[x(T0), base]];
  for (const d of evs) { pts.push([x(evMin(d)), base - (acc / max) * (base - 64)]); acc += d.exposure; pts.push([x(evMin(d)), base - (acc / max) * (base - 64)]); }
  pts.push([x(T1 - 20), base - (acc / max) * (base - 64)]);
  el("path", { d: `M${pts.map((p) => p.join(",")).join(" L")} L${x(T1 - 20)},${base} Z`, class: "area" }, TL);
  el("path", { d: `M${pts.map((p) => p.join(",")).join(" L")}`, class: "curve" }, TL);
  evs.forEach((d, i) => {
    const g = el("g", { class: `tick ${d.id === sel ? "on" : ""}`, "data-d": d.id, tabindex: 0 }, TL);
    const yy = 12 + (i % 3) * 17;
    el("line", { x1: x(evMin(d)), x2: x(evMin(d)), y1: yy + 6, y2: base, stroke: "#3a3a44", "stroke-dasharray": "2 3" }, g);
    el("circle", { cx: x(evMin(d)), cy: yy, r: 5 }, g);
    // phones get the time only; the card above names the incident
    const t = el("text", { x: x(evMin(d)) + 9, y: yy + 4 }, g); t.textContent = W < 700 ? d.started : `${d.started} ${d.title.split(" ").slice(0, 3).join(" ")}`;
  });
  window.__x = x;
}
let playing = false;
async function play() {
  if (playing) return; playing = true;
  shown.clear(); sel = null; paint(false); timeline();
  const evs = [...C.disruptions].sort((a, b) => evMin(a) - evMin(b));
  for (const d of evs) { await new Promise((r) => setTimeout(r, 1300)); shown.add(d.id); sel = d.id; paint(); timeline(); }
  playing = false;
}
document.getElementById("role").innerHTML = C.roles.map((r) => `<option value="${r.id}">${esc(r.title)}</option>`).join("");
document.getElementById("role").addEventListener("change", (e) => { role = e.target.value; layout(); });
document.addEventListener("click", (e) => {
  const tk = e.target.closest(".tick"), n = e.target.closest(".n"), pb = e.target.closest("[data-pb]");
  if (pb) { approved.add(pb.dataset.pb); card(); return; }
  if (tk) { sel = tk.dataset.d; shown.add(sel); paint(); timeline(); return; }
  if (n) { inspect(n.dataset.n); return; }
  if (e.target.closest("#play")) { play(); return; }
  if (e.target.closest("#chaos")) { chaos = !chaos; e.target.closest("#chaos").setAttribute("aria-pressed", chaos); document.getElementById("rp").classList.toggle("chaos", chaos); return; }
  inspect(null);
});
addEventListener("resize", () => { layout(); timeline(); });
layout(); timeline();
// open on the biggest incident, already rippled, so the first look is never empty
C.disruptions.forEach((d) => shown.add(d.id)); sel = C.disruptions[0].id; paint(); timeline();
</script>
</body>
</html>
