<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B - Triage Desk (control tower concept)</title>
<link rel="stylesheet" href="base.css">
<style>
/* B, Triage Desk: the incident is a brief you can act on. Queue on the left, the brief in the middle written
   like a memo (what happened, what it touches, money at risk, how the agent got there, what to do), and the
   people and the audit on the right. Switch who you are and the whole desk redraws under that role. */
:root{--paper:#f5f3ee;--card:#fffefb;--ink:#14161a;--mut:#626873;--line:#e2ded4;--line2:#d2cdc0;--fill:#ece8de;
  --hot:#e5482d;--warm:#c98a12;--cool:#1f6feb;--ok:#1d8a5a;
  --serif:"Sitka Heading","Sitka Display","Sitka",Georgia,serif;--ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--fig:Bahnschrift,"Segoe UI",sans-serif;--mono:"Cascadia Mono",Consolas,monospace}
body{background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--ui)}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.desk{display:grid;grid-template-columns:330px minmax(0,1fr) 300px;height:calc(100dvh - var(--bar))}
/* queue */
.q{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#efece5}
.qh{padding:18px 18px 12px}
.qh .co{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.qh h1{font:400 30px/1.05 var(--serif);letter-spacing:-.01em;margin-top:8px}
.qh p{font-size:12.5px;color:var(--mut);margin-top:6px}
.tot{display:grid;grid-template-columns:1fr 1fr;margin:14px 18px 0;border-top:1.5px solid var(--ink)}
.tot div{padding:9px 0 10px}
.tot b{display:block;font:600 22px/1 var(--fig);font-stretch:90%}
.tot span{font-size:11.5px;color:var(--mut)}
.tot .h b{color:var(--hot)}
.list{overflow-y:auto;flex:1;margin-top:8px;scrollbar-width:thin}
.it{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;width:100%;padding:12px 18px;border-top:1px solid var(--line);align-items:baseline}
.it:hover{background:#e7e3d9}
.it[aria-current=true]{background:var(--card);box-shadow:inset 3px 0 0 var(--ink)}
.it i{font:600 12px var(--mono);font-style:normal;color:var(--mut)}
.it b{font-weight:600;line-height:1.3}
.it em{font:600 15px var(--fig);font-style:normal;white-space:nowrap}
.it em.z{color:var(--mut);font-weight:400}
.it small{grid-column:2/4;font-size:12px;color:var(--mut)}
.bar{grid-column:2/4;height:3px;background:var(--fill);border-radius:2px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--hot)}
/* brief */
.brief{overflow-y:auto;padding:34px 44px 80px;scrollbar-width:thin}
.k{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
.k .kind{color:var(--hot)}
.brief h2{font:400 clamp(34px,3.4vw,52px)/1.03 var(--serif);letter-spacing:-.02em;margin-top:12px;max-width:20ch}
.brief .lead{font-size:17px;color:#33373e;margin-top:14px;max-width:62ch}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:28px;border-top:1.5px solid var(--ink)}
.money div{padding:12px 16px 14px 0;border-bottom:1px solid var(--line)}
.money b{display:block;font:600 34px/1 var(--fig);font-stretch:88%}
.money .h b{color:var(--hot)}
.money span{font-size:12px;color:var(--mut)}
.sec{margin-top:40px}
.sec h3{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
/* the chain: what it touches */
.chain{display:flex;align-items:stretch;gap:0;margin-top:16px;overflow-x:auto;padding-bottom:4px}
.node{flex:1 1 0;min-width:0;padding:12px 14px;background:var(--card);border:1px solid var(--line2);border-radius:10px}
.node small{display:block;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.node b{display:block;font-size:15px;margin-top:4px;line-height:1.25}
.node span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.node.hot{border-color:var(--hot);box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 14%,transparent)}
.tw{overflow-x:auto}
.link{flex:none;width:24px;align-self:center;height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 10px);position:relative;animation:march 1s linear infinite;background-size:10px 2px}
.link::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--ink);border-right:0}
@keyframes march{to{background-position:10px 0}}
/* the agent */
.agent{display:grid;grid-template-columns:auto 1fr auto;gap:0 14px;margin-top:14px}
.agent div{display:contents}
.agent i{font:600 12px var(--mono);font-style:normal;color:var(--mut);padding:9px 0;border-bottom:1px solid var(--line)}
.agent p{padding:9px 0;border-bottom:1px solid var(--line)}
.agent em{font:12px var(--mono);font-style:normal;color:var(--mut);padding:9px 0;border-bottom:1px solid var(--line);text-align:right}
.quote{margin-top:14px;padding:14px 18px;background:var(--card);border:1px solid var(--line2);border-radius:10px;font:400 18px/1.4 var(--serif)}
.quote b{display:block;font:600 11px var(--mono);letter-spacing:.08em;color:var(--warm);margin-bottom:6px}
/* playbooks */
.pbs{display:grid;gap:10px;margin-top:14px}
.pb{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--line2);border-radius:10px}
.pb b{font-size:15px}
.pb span{font-size:12.5px;color:var(--mut)}
.pb .nums{display:flex;gap:18px;font:600 13px var(--fig);margin-top:2px}
.pb .nums em{font-style:normal;color:var(--ok)}
.pb button{grid-row:1/4;grid-column:2;padding:10px 16px;border-radius:8px;font-weight:600;background:var(--ink);color:#fff;white-space:nowrap}
.pb button.need{background:var(--hot)}
.pb button.need::before{content:"";display:inline-block;width:8px;height:10px;margin-right:8px;border:1.5px solid #fff;border-radius:2px 2px 1px 1px;vertical-align:-1px}
.pb button:hover{filter:brightness(1.15)}
.pb button.done{background:none;color:var(--ok);border:1.5px solid var(--ok)}
.pb .lock{grid-column:1;font:11px var(--mono);color:var(--hot)}
.pb .aud{grid-column:1/-1;font:11.5px var(--mono);color:var(--ok);padding-top:6px;border-top:1px dashed var(--line2)}
/* table */
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px 8px 0;border-bottom:1.5px solid var(--ink);position:sticky;top:0;background:var(--paper)}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
td .m{font:12px var(--mono);color:var(--mut)}
.masked{display:inline-block;padding:0 6px;border-radius:4px;background:repeating-linear-gradient(135deg,#dcd7cb 0 4px,#e8e4da 4px 8px);color:#6b6f78;font:11px var(--mono)}
.hidden-row td{color:var(--warm);font-style:italic}
/* side */
.side{border-left:1px solid var(--line);padding:18px;overflow-y:auto;background:#efece5}
.side h4{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.who{display:grid;gap:6px}
.who button{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;padding:10px;border-radius:10px;border:1px solid transparent;align-items:center}
.who button[aria-pressed=true]{background:var(--card);border-color:var(--line2)}
.who .av{grid-row:1/3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--ui);color:#fff}
.who b{font-size:13px;line-height:1.2}
.who span{font-size:11.5px;color:var(--mut);line-height:1.3}
.rule{margin-top:10px;font-size:12px;color:#3d424a;padding:10px 12px;border-radius:8px;background:var(--fill)}
.audit{display:grid;gap:10px;margin-top:6px}
.audit div{font-size:12px;line-height:1.4;padding-left:12px;border-left:2px solid var(--line2)}
.audit div.new{border-color:var(--ok);animation:inn .5s var(--ease)}
@keyframes inn{from{opacity:0;transform:translateX(6px)}}
.audit i{display:block;font:11px var(--mono);font-style:normal;color:var(--mut)}
.health{display:grid;gap:7px;font-size:12px}
.health div{display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.health em{font-style:normal;font:600 12px var(--fig)}
.health small{grid-column:1/-1;color:var(--mut)}
.health .w em{color:var(--warm)}
.health .b em{color:var(--hot)}
.chaosb{margin-top:10px;width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line2);font-weight:600;font-size:12.5px}
.chaosb[aria-pressed=true]{background:var(--hot);border-color:var(--hot);color:#fff}
@media(max-width:1180px){.desk{grid-template-columns:300px minmax(0,1fr)}.side{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.desk{height:auto}.list,.brief{overflow:visible}}
@media(max-width:760px){.chain{flex-direction:column;gap:8px}.chain .link{display:none}.desk{display:block}.q{border-right:0}.brief{padding:24px 16px 48px}.money{grid-template-columns:1fr 1fr}.money div:last-child{grid-column:1/-1}.brief h2{font-size:32px}}
</style>
</head>
<body>
<div class="desk">
  <aside class="q">
    <div class="qh"><div class="co">Tarangini Distribution · <span id="clock" class="num"></span></div><h1>Today's incidents</h1><p id="qsub"></p></div>
    <div class="tot" id="tot"></div>
    <div class="list" id="list"></div>
  </aside>
  <main class="brief" id="brief" tabindex="-1"></main>
  <aside class="side">
    <h4>Viewing as</h4>
    <div class="who" id="who"></div>
    <div class="rule" id="rule"></div>
    <h4 style="margin-top:24px">Audit trail</h4>
    <div class="audit" id="audit"></div>
    <h4 style="margin-top:24px">Data feeds</h4>
    <div class="health" id="health"></div>
    <button class="chaosb" id="chaos" aria-pressed="false">Simulate outage</button>
  </aside>
</div>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
conceptbar("B", "Triage Desk", "Queue-first, light and editorial. Each incident is a brief; switch who you are and the desk redraws under that role.");
clock(document.getElementById("clock"), (d) => d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Kolkata" }));
let role = "vp", sel = C.disruptions[0].id, chaos = false;
const AV = { vp: "#14161a", south: "#1f6feb", fin: "#1d8a5a" };
const audit = [
  { t: "10:31", who: "Agent", what: "Opened D-117 from the Kolkata DC maintenance feed" },
  { t: "10:12", who: "Asha Rao", what: "Viewed D-114; asked the agent for a stock transfer option" },
  { t: "09:58", who: "Agent", what: "Masked 3 driver phone numbers in a reply to Dispatcher, South" },
  { t: "09:40", who: "System", what: "14 ERP rows sent to dead letters: blank promised date" },
];
const approved = new Set();
const vis = () => C.disruptions.filter((d) => role !== "south" || d.shipments.some((id) => shipOf(id).dc === "DC-HYD"));
const mine = (d) => d.shipments.map(shipOf).filter(ROLE_SCOPE[role]);

function list() {
  const ds = vis(), max = Math.max(...ds.map((d) => d.exposure), 1);
  if (!ds.find((d) => d.id === sel)) sel = ds[0]?.id;
  document.getElementById("qsub").textContent = `${ds.length} open · ranked by money at risk`;
  const ships = C.shipments.filter(ROLE_SCOPE[role]);
  document.getElementById("tot").innerHTML = `<div><b class="num">${inr(ships.reduce((a, s) => a + s.value, 0))}</b><span>moving in ${ships.length} trucks</span></div><div class="h"><b class="num">${inr(ds.reduce((a, d) => a + d.exposure, 0))}</b><span>at risk today</span></div>`;
  document.getElementById("list").innerHTML = ds.map((d, i) => `<button class="it" data-d="${d.id}" aria-current="${d.id === sel}">
    <i>${String(i + 1).padStart(2, "0")}</i><b>${esc(d.title)}</b><em class="num ${d.exposure ? "" : "z"}">${d.exposure ? inr(d.exposure) : "₹0"}</em>
    <small>${d.kind} · since ${d.started} · ${d.shipments.length} shipments</small><span class="bar"><span style="width:${(d.exposure / max) * 100}%"></span></span></button>`).join("");
}
function chainFor(d, ships) {
  const dcs = [...new Set(ships.map((s) => s.dc))].map(dcOf);
  const cars = [...new Set(ships.map((s) => s.carrier))].map(carrierOf);
  const cities = [...new Set(ships.map((s) => s.zone))].map(zoneOf);
  const custs = new Set(ships.map((s) => s.customer.split(" (")[0]));
  const first = d.kind === "Supplier" ? { k: "Supplier", b: supOf(d.supplier)?.name ?? "Supplier", s: "5 days late · 14 SKUs" }
    : d.kind === "Carrier" ? { k: "Carrier", b: carrierOf(d.carrier).name, s: "strike in Uttar Pradesh" }
    : d.kind === "Facility" ? { k: "Facility", b: "Kolkata DC, dock 2", s: "loading at 40%" }
    : { k: "Event", b: d.title.split(" near ")[0].split(" on ")[0], s: d.started + " today" };
  const nodes = [first, { k: "Warehouse", b: dcs.map((x) => x.city.split(" (")[0]).join(", ") || "none in view", s: `${dcs.length} DC${dcs.length === 1 ? "" : "s"}` },
    { k: "Carriers", b: cars.map((c) => c.name.split(" ")[0]).join(", ") || "none", s: `${ships.length} trucks` },
    { k: "Cities", b: cities.slice(0, 3).map((c) => c.city).join(", ") + (cities.length > 3 ? ` +${cities.length - 3}` : ""), s: `${cities.length} cities` },
    { k: "Customers", b: `${custs.size} retail customers`, s: `${inr(ships.reduce((a, s) => a + s.value, 0))} of goods` }];
  return nodes.map((n, i) => `<div class="node ${i === 0 ? "hot" : ""}"><small>${n.k}</small><b>${esc(n.b)}</b><span>${esc(n.s)}</span></div>`).join('<span class="link"></span>');
}
function brief() {
  const d = C.disruptions.find((x) => x.id === sel);
  if (!d) { document.getElementById("brief").innerHTML = "<p>No incidents in your view.</p>"; return; }
  const ships = mine(d), hidden = d.shipments.length - ships.length;
  const valueMine = ships.reduce((a, s) => a + s.value, 0);
  const expMine = d.value ? d.exposure * (valueMine / d.value) : d.exposure;
  document.getElementById("brief").innerHTML = `
    <div class="k"><span class="kind">${d.kind}</span><span>${d.id}</span><span>since ${d.started}</span><span>${esc(d.clause.id)}</span></div>
    <h2>${esc(d.title)}</h2>
    <p class="lead">${esc(d.detail)}</p>
    <div class="money"><div class="h"><b class="num">${inr(expMine)}</b><span>money at risk${role === "south" ? " in your zone" : ""}</span></div><div><b class="num">${inr(valueMine)}</b><span>goods on affected trucks</span></div><div><b class="num">${ships.length}</b><span>shipments${hidden ? `, ${hidden} hidden by your role` : ""}</span></div></div>
    <section class="sec"><h3><span>What it touches</span><span>ontology walk</span></h3><div class="chain">${chainFor(d, ships)}</div></section>
    <section class="sec"><h3><span>How the agent got there</span><span>${(d.agent.ms / 1000).toFixed(1)} s · ${d.agent.tokens.toLocaleString("en-IN")} tokens · local · ₹0</span></h3>
      <div class="agent">${d.agent.steps.map((s, i) => `<div><i>${String(i + 1).padStart(2, "0")}</i><p>${esc(s)}</p><em>${["graph", "graph", "contract", "math", "plan"][i]}</em></div>`).join("")}</div>
      <div class="quote"><b>${esc(d.clause.id)} · quoted from the customer contract</b>${esc(d.clause.text)}</div></section>
    <section class="sec"><h3><span>What to do</span><span>over ₹5 L needs a person</span></h3><div class="pbs">${d.playbooks.map((p) => {
      const k = d.id + p.id, done = approved.has(k);
      return `<div class="pb"><b>${esc(p.title)}</b><span>${esc(p.impact)}</span><div class="nums">${p.cost ? `<span>costs ${inr(p.cost)}</span>` : ""}${p.saves ? `<em>saves ${inr(p.saves)}</em>` : ""}</div>
        ${p.needsApproval && !done ? `<span class="lock">waits for approval: moves more than ₹5 L of goods</span>` : ""}
        <button class="${done ? "done" : p.needsApproval ? "need" : ""}" data-pb="${k}" data-t="${esc(p.title)}">${done ? "Done" : p.needsApproval ? "Approve" : "Run"}</button>
        ${done ? `<span class="aud">${C.roles.find((r) => r.id === role).name} · ${hhmm(new Date().toISOString())} · written to the ERP · audit A-${2200 + [...approved].indexOf(k)}</span>` : ""}</div>`;
    }).join("")}</div></section>
    <section class="sec"><h3><span>Shipments</span><span>${ships.length} of ${d.shipments.length}</span></h3>
      <div class="tw"><table><thead><tr><th>Shipment</th><th>Customer</th><th>Carrier</th><th>Driver phone</th><th>Carrier bank</th><th class="r">Value</th></tr></thead><tbody>
      ${ships.slice(0, 12).map((s) => { const c = carrierOf(s.carrier); const ph = mask(c.contact, role, "phone"), bk = mask(c.bank, role, "bank");
        return `<tr><td><span class="m">${s.id}</span></td><td>${esc(s.customer)}</td><td>${esc(c.name.split(" ")[0])}</td><td>${ph.includes("•") ? `<span class="masked">masked</span>` : ph}</td><td>${bk.includes("•") ? `<span class="masked">masked</span>` : bk}</td><td class="r num">${inr(s.value)}</td></tr>`; }).join("")}
      ${hidden ? `<tr class="hidden-row"><td colspan="6">${hidden} shipments outside Hyderabad DC lanes are hidden for this role</td></tr>` : ""}
      </tbody></table></div></section>`;
}
function side() {
  document.getElementById("who").innerHTML = C.roles.map((r) => `<button data-role="${r.id}" aria-pressed="${r.id === role}"><span class="av" style="background:${AV[r.id]}">${r.name.split(" ").map((x) => x[0]).join("")}</span><b>${esc(r.name)}</b><span>${esc(r.title)} · ${esc(r.scope)}</span></button>`).join("");
  document.getElementById("rule").textContent = `Sees ${C.roles.find((r) => r.id === role).sees}. Enforced where the agent retrieves data, not in the screen.`;
  document.getElementById("audit").innerHTML = audit.map((a, i) => `<div class="${a.new ? "new" : ""}"><i>${a.t} · ${esc(a.who)}</i>${esc(a.what)}</div>`).join("");
  document.getElementById("health").innerHTML = C.health.feeds.map((f) => {
    const ok = chaos && /Carrier|ERP/.test(f.name) ? 0.7 : f.ok;
    return `<div class="${ok < 0.8 ? "b" : ok < 0.97 ? "w" : ""}"><span>${esc(f.name.split(" (")[0])}</span><em class="num">${(ok * 100).toFixed(1)}%</em>${(chaos && /Carrier/.test(f.name)) ? "<small>circuit open: serving cached ETAs, retrying with backoff</small>" : f.note ? `<small>${esc(f.note)}</small>` : ""}</div>`;
  }).join("") + `<div><span>Dead letters to fix</span><em class="num">${C.health.dlq + (chaos ? 41 : 0)}</em></div>`;
}
function render() { list(); brief(); side(); }
document.addEventListener("click", (e) => {
  const it = e.target.closest(".it"), rb = e.target.closest("[data-role]"), pb = e.target.closest("[data-pb]");
  if (pb && !pb.classList.contains("done")) { approved.add(pb.dataset.pb); audit.unshift({ t: hhmm(new Date().toISOString()), who: C.roles.find((r) => r.id === role).name, what: `${pb.classList.contains("need") ? "Approved" : "Ran"}: ${pb.dataset.t}`, new: true }); brief(); side(); return; }
  if (it) { sel = it.dataset.d; list(); brief(); document.getElementById("brief").scrollTop = 0; return; }
  if (rb) { role = rb.dataset.role; render(); return; }
  if (e.target.closest("#chaos")) { chaos = !chaos; e.target.closest("#chaos").setAttribute("aria-pressed", chaos); side(); }
});
render();
</script>
</body>
</html>
